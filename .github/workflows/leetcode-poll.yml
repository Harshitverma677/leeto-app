name: Poll LeetCode Solves

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Grant permission to commit changes back to the repository
permissions:
  contents: write

jobs:
  poll-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Worker Dependencies
        run: |
          cd backend-worker
          npm install

      - name: Run LeetCode Poller
        run: |
          cd backend-worker
          node worker.js

      - name: Persist Solves State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend-worker/last_seen.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync latest solves cache [skip ci]" && git push)